<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeChat Intelligence</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { margin: 0; } main { width: min(860px, calc(100% - 32px)); margin: 70px auto; }
    .card { background: #fff; border: 1px solid #e1e7f0; border-radius: 18px; padding: clamp(24px, 5vw, 42px); box-shadow: 0 12px 35px #17203312; }
    h1 { margin: 0 0 10px; } p { color: #62708a; line-height: 1.6; }
    label { display: block; margin-top: 24px; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; padding: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; }
    button, a { display: inline-block; margin-top: 18px; padding: 13px 20px; border: 0; border-radius: 10px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .6; cursor: wait; } #status { min-height: 26px; font-weight: 600; color: #166534; }
    .hint { font-size: 14px; } .secondary { background: #64748b; margin-left: 8px; }
    @media (max-width: 640px) { main { margin: 25px auto; } .secondary { margin-left: 0; } }
  </style>
</head>
<body>
  <main><section class="card">
    <h1>WeChat Intelligence</h1>
    <p>Dán link bài viết WeChat để xem kết luận có trong bài và số container xuất khẩu theo ngày.</p>
    <label for="source">Link bài viết</label>
    <input id="source" type="url" placeholder="https://mp.weixin.qq.com/s/..." autocomplete="off" required>
    <p class="hint">Sao chép link của bài viết từ WeChat rồi dán vào đây.</p>
    <button id="fetch" type="button">Lấy bài viết</button>
    <a class="secondary" href="/articles">Bài viết đã lưu</a>
    <a class="secondary" href="/report#dashboard">Dashboard</a>
    <p id="status" role="status" aria-live="polite"></p>
  </section></main>
  <script>
    const source = document.querySelector('#source');
    const fetchButton = document.querySelector('#fetch');
    const status = document.querySelector('#status');
    async function run() {
      const value = source.value.trim();
      if (!value) { status.textContent = 'Hãy dán link bài viết WeChat trước.'; return; }
      let articleUrl;
      try { articleUrl = new URL(value); }
      catch { status.textContent = 'Link bài viết không hợp lệ.'; return; }
      if (articleUrl.protocol !== 'https:' || articleUrl.hostname !== 'mp.weixin.qq.com' || !/^\/s(?:\/|$)/.test(articleUrl.pathname)) {
        status.textContent = 'Hãy dùng link bài viết https://mp.weixin.qq.com/s/...'; return;
      }
      fetchButton.disabled = true; status.textContent = 'Đang tải bài viết...';
      try {
        const response = await fetch('/api/articles', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({url: articleUrl.href})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Không lấy được bài viết');
        window.location.href = data.id ? '/report?id=' + encodeURIComponent(data.id) : '/report';
      } catch (error) { status.textContent = error.message; }
      finally { fetchButton.disabled = false; }
    }
    fetchButton.addEventListener('click', run);
    source.addEventListener('keydown', event => { if (event.key === 'Enter') run(); });
  </script>
</body>
</html>
