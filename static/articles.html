<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài viết đã lưu · WeChat Intelligence</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { margin: 0; } main { width: min(960px, calc(100% - 32px)); margin: 36px auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 40px); }
    h2 { margin: 0 0 10px; font-size: 21px; line-height: 1.4; }
    p { color: #64748b; line-height: 1.6; }
    a { color: #2563eb; text-decoration: none; font-weight: 700; }
    .action { display: inline-block; background: #2563eb; color: white; padding: 12px 18px; border-radius: 10px; }
    button.refresh { margin-left: 14px; border: 1px solid #2563eb; border-radius: 9px; padding: 9px 13px; background: white; color: #2563eb; font: inherit; font-weight: 700; cursor: pointer; }
    button.refresh:disabled { opacity: .6; cursor: wait; }
    .sync-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 22px; }
    .sync-tools button { border: 0; border-radius: 10px; padding: 12px 18px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .sync-tools button:disabled { opacity: .6; cursor: wait; }
    .sync-tools .progress-log { flex-basis: 100%; }
    button.delete { margin-left: 8px; border: 1px solid #b42318; border-radius: 9px; padding: 9px 13px; background: white; color: #b42318; font: inherit; font-weight: 700; cursor: pointer; }
    button.delete:disabled { opacity: .6; cursor: wait; }
    input { width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; margin: 8px 0 18px; }
    .card { background: white; border: 1px solid #e1e7f0; border-radius: 15px; padding: 22px; margin-bottom: 14px; box-shadow: 0 8px 25px #1720330d; }
    .meta { margin: 0 0 14px; font-size: 14px; }
    .error { color: #b42318; }
    .progress-log { margin: 4px 0 0; padding-left: 24px; color: #475569; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Bài viết đã lưu</h1><p id="count">Đang tải danh sách...</p></div>
      <a class="action" href="/">+ Thêm bài viết</a>
    </header>
    <section class="sync-tools" aria-label="Đồng bộ bài WeChat hôm nay">
      <button id="sync-today" type="button">Đồng bộ bài hôm nay</button>
      <span id="sync-status" role="status" aria-live="polite"></span>
      <ol class="progress-log" id="sync-log" aria-label="Nhật ký đồng bộ" aria-live="polite" hidden></ol>
    </section>
    <label for="search"><strong>Tìm bài viết</strong></label>
    <input id="search" type="search" placeholder="Nhập tiêu đề hoặc tên tài khoản">
    <div id="list" role="status" aria-live="polite"></div>
  </main>
  <script src="/static/progress.js"></script>
  <script>
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[char]);
    let articles = [];
    function render() {
      const query = document.querySelector('#search').value.trim().toLocaleLowerCase();
      const filtered = articles.filter(article => (article.title + ' ' + article.account_name).toLocaleLowerCase().includes(query));
      document.querySelector('#count').textContent = articles.length + ' bài viết đã lưu';
      document.querySelector('#list').innerHTML = filtered.length ? filtered.map(article => {
        const href = '/report?id=' + encodeURIComponent(article.id);
        const date = article.published_at || article.time || '';
        return `<article class="card"><h2><a href="${href}">${escapeHtml(article.title)}</a></h2>` +
          `<p class="meta">${escapeHtml(article.account_name)}${date ? ' · ' + escapeHtml(date) : ''}</p>` +
          `<a href="${href}">Xem chi tiết →</a><button class="refresh" type="button" data-id="${encodeURIComponent(article.id)}">Cập nhật bài viết</button><button class="delete" type="button" data-id="${encodeURIComponent(article.id)}">Xóa bài viết</button><p class="meta refresh-status" role="status"></p><ol class="progress-log" aria-label="Nhật ký cập nhật bài viết" aria-live="polite" hidden></ol></article>`;
      }).join('') : '<p>Không tìm thấy bài viết phù hợp.</p>';
    }
    document.querySelector('#search').addEventListener('input', render);
    document.querySelector('#sync-today').addEventListener('click', async () => {
      const button = document.querySelector('#sync-today');
      const status = document.querySelector('#sync-status');
      button.disabled = true;
      status.className = '';
      status.textContent = 'Đang đồng bộ bài trong ngày từ WeChat...';
      try {
        const result = await runArticleJob('/api/wechat/sync-today/jobs', {method: 'POST'}, document.querySelector('#sync-log'));
        status.textContent = `Đã kiểm tra ${result.synced} bài hôm nay, thêm ${result.imported} bài mới.`;
        const response = await fetch('/api/reports?ts=' + Date.now(), {cache: 'no-store'});
        if (response.ok) { articles = await response.json(); render(); }
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    document.querySelector('#list').addEventListener('click', async event => {
      const deleteButton = event.target.closest('button.delete');
      if (deleteButton) {
        const id = decodeURIComponent(deleteButton.dataset.id);
        const article = articles.find(item => item.id === id);
        if (!confirm(`Xóa bài viết “${article?.title || id}” khỏi danh sách và dashboard?`)) return;
        const card = deleteButton.closest('article');
        const status = card.querySelector('.refresh-status');
        card.querySelectorAll('button').forEach(button => button.disabled = true);
        status.textContent = 'Đang xóa bài viết...';
        try {
          const path = '/api/reports/' + id.split('/').map(encodeURIComponent).join('/');
          const response = await fetch(path, {method: 'DELETE'});
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || 'Không xóa được bài viết.');
          articles = articles.filter(item => item.id !== id);
          render();
        } catch (error) {
          status.className = 'meta refresh-status error';
          status.textContent = error.message;
          card.querySelectorAll('button').forEach(button => button.disabled = false);
        }
        return;
      }
      const button = event.target.closest('button.refresh');
      if (!button) return;
      const status = button.parentElement.querySelector('.refresh-status');
      const progressLog = button.parentElement.querySelector('.progress-log');
      button.disabled = true;
      status.className = 'meta refresh-status';
      status.textContent = 'Đang tải lại bài viết từ link gốc...';
      try {
        const id = decodeURIComponent(button.dataset.id);
        const path = '/api/reports/' + id.split('/').map(encodeURIComponent).join('/') + '/refresh/jobs';
        await runArticleJob(path, {method: 'POST'}, progressLog);
        status.textContent = 'Đã cập nhật. Mở chi tiết để xem nội dung mới.';
      } catch (error) {
        status.className = 'meta refresh-status error';
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    fetch('/api/reports?ts=' + Date.now(), {cache: 'no-store'})
      .then(response => { if (!response.ok) throw new Error('Không tải được danh sách bài viết.'); return response.json(); })
      .then(data => { articles = data; render(); })
      .catch(error => { document.querySelector('#count').textContent = ''; document.querySelector('#list').innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`; });
  </script>
</body>
</html>
